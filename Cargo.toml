[package]
name = "cit-atlas"
version = "1.8.0"
edition = "2021"
authors = ["Citations Analytics Suite"]
description = "Native Rust Citations Analytics Workstation with wgpu WGSL 50,000+ Node Graph Renderer, Per-Domain Token-Bucket Rate Limiter & Crawl Audit Telemetry, Europe PMC/UniProt/PDB & DataCite Bridges, Retraction Watch Screening & 10-Table CSV Suite"
license = "GPL-3.0-or-later"

[lib]
name = "cit_atlas"
path = "src/lib.rs"

[[bin]]
name = "cit-atlas"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.31", features = ["wgpu"] }
egui = "0.31"
png = "0.18"
rayon = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
wgpu = "24.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
